# =============================================================================
# Tmux Configuration - fibonatto 
# =============================================================================

# -----------------------------------------------------------------------------
# Palette
# -----------------------------------------------------------------------------
set -g @bg         "#E5E3DF"
set -g @bg_alt     "#B2AFA8"
set -g @fg         "#4A4C52"
set -g @muted      "#6B6E73"
set -g @border     "#B2AFA8"
set -g @red        "#C96A61"
set -g @green      "#6E9B73"
set -g @yellow     "#B08B4F"
set -g @blue       "#5B8FA8"
set -g @magenta    "#9A6F96"
set -g @cyan       "#7E9C99"
set -g @separator  "\uE0B0"
set -g @dot        "·"

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------
set -g mouse on
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -g focus-events on
set -s extended-keys on
setw -g mode-keys vi
set -g status-keys vi
set -sg escape-time 0
set -g repeat-time 500
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
setw -g monitor-activity on
set -g visual-activity off
set -g bell-action none
set -g visual-bell off
set -g set-titles on
set -g set-titles-string "#S:#I #W"
set -s set-clipboard external

# -----------------------------------------------------------------------------
# Prefix
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-s
bind-key -N "Tmux prefix" C-s send-prefix

# -----------------------------------------------------------------------------
# Pane Navigation & Resize (Option hjkl for Navigation)
# -----------------------------------------------------------------------------
bind-key -n -N "Select pane left"  M-h select-pane -L
bind-key -n -N "Select pane down"  M-j select-pane -D
bind-key -n -N "Select pane up"    M-k select-pane -U
bind-key -n -N "Select pane right" M-l select-pane -R

bind-key -r -N "Resize pane left"  H resize-pane -L 5
bind-key -r -N "Resize pane down"  J resize-pane -D 5
bind-key -r -N "Resize pane up"    K resize-pane -U 5
bind-key -r -N "Resize pane right" L resize-pane -R 5

# -----------------------------------------------------------------------------
# Pane Management
# -----------------------------------------------------------------------------
bind-key -N "Split horizontal" v split-window -h -c "#{pane_current_path}"
bind-key -N "Split vertical"   s split-window -v -c "#{pane_current_path}"
bind-key -N "Kill pane"        x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind-key -N "Toggle zoom"      z resize-pane -Z
bind-key -N "Previous pane"    o select-pane -l
bind-key -N "Show pane numbers" q display-panes
bind-key -N "Rotate panes"     R rotate-window
bind-key -N "Kill other panes" ! kill-pane -a

bind-key -N "Scratch shell" g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# -----------------------------------------------------------------------------
# Window Management
# -----------------------------------------------------------------------------
bind-key -N "New window" c new-window -c "#{pane_current_path}"
bind-key -N "Kill window" X confirm-before -p "kill-window #W? (y/n)" kill-window
bind-key -N "Previous window" p previous-window
bind-key -N "Next window" n next-window
bind-key -N "Last window" Tab last-window
bind-key -r -N "Move window left"  "<" swap-window -t -1
bind-key -r -N "Move window right" ">" swap-window -t +1
bind-key -N "Auto-rename window" A rename-window "#{b:pane_current_path}"
bind-key -N "Rename window" , command-prompt -I "#W" "rename-window '%%'"
bind-key -N "Choose tree" w choose-tree -Zw

bind-key -N "Select window 1" 1 select-window -t 1
bind-key -N "Select window 2" 2 select-window -t 2
bind-key -N "Select window 3" 3 select-window -t 3
bind-key -N "Select window 4" 4 select-window -t 4
bind-key -N "Select window 5" 5 select-window -t 5
bind-key -N "Select window 6" 6 select-window -t 6
bind-key -N "Select window 7" 7 select-window -t 7
bind-key -N "Select window 8" 8 select-window -t 8
bind-key -N "Select window 9" 9 select-window -t 9

# -----------------------------------------------------------------------------
# Copy Mode
# -----------------------------------------------------------------------------
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
setw -g copy-mode-line-numbers relative

# -----------------------------------------------------------------------------
# DevOps Tools & FZF Popups
# -----------------------------------------------------------------------------
bind-key -N "Synchronize panes" S set-window-option synchronize-panes \; display-message "synchronize-panes #{?pane_synchronized,on,off}"

bind-key -N "SSH Launcher" O display-popup -E -w 50% -h 50% "awk '/^Host / {print \$2}' ~/.ssh/config | grep -v '*' | fzf --prompt='SSH> ' | xargs -r -I {} tmux new-window -n {} ssh {}"

bind-key -N "Project Sessionizer" f display-popup -E -w 80% -h 80% "find ~/projects -maxdepth 2 -type d | fzf --prompt='Project> ' | xargs -I {} tmux new-session -d -s \$(basename {}) -c {} && tmux switch-client -t \$(basename {})"

bind-key -N "Switch Session" T display-popup -E -w 40% -h 40% "tmux list-sessions -F '#{session_name}' | fzf --prompt='Session> ' | xargs tmux switch-client -t"

bind-key -N "Kill Session" K confirm-before -p "Kill session #S? (y/n)" "kill-session -t '#S'"

# -----------------------------------------------------------------------------
# Observability & Logging
# -----------------------------------------------------------------------------
bind-key -N "Snapshot Pane" P run-shell "mkdir -p ~/.tmux/logs && tmux capture-pane -J -S - -E - -p > ~/.tmux/logs/#S_#W_#P_$(date +%Y%m%d_%H%M%S).log" \; display-message "Snapshot saved to ~/.tmux/logs/"

bind-key -N "Continuous Logging" p run-shell "mkdir -p ~/.tmux/logs" \; pipe-pane -o "ansifilter >> ~/.tmux/logs/#S_#W_#P_$(date +%%Y%%m%%d_%%H%%M%%S).log" \; display-message "Telemetry pipe toggled."

bind-key -N "View Last Log" L display-popup -E -w 80% -h 80% "ls -t ~/.tmux/logs/#S_#W_#P_*.log | head -n 1 | xargs -I {} nvim -R {}"

# -----------------------------------------------------------------------------
# Configuration Management
# -----------------------------------------------------------------------------
bind-key -N "Reload Config" r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind-key -N "Edit Config" e display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "$SHELL -lc 'nvim ~/.tmux.conf'"

# -----------------------------------------------------------------------------
# Appearance & Status Bar
# -----------------------------------------------------------------------------
set -g pane-border-lines single
set -gF pane-border-style "fg=#{@border}"
set -gF pane-active-border-style "fg=#{@green}"
set -g pane-border-indicators colour
set -g pane-border-status top
set -g pane-border-format "#[fg=#{@muted}] #{pane_index} #{pane_current_command} "

set -gF status-style "bg=#{@bg},fg=#{@fg}"
set -gF message-style "bg=#{@bg_alt},fg=#{@fg}"
set -gF message-command-style "bg=#{@bg_alt},fg=#{@fg}"
set -gF mode-style "bg=#{@yellow},fg=#{@bg}"

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left

set -g automatic-rename off
set -gF window-status-style "bg=#{@bg},fg=#{@muted}"
set -g window-status-format "#[fg=#{@muted}] #I #W "
set -gF window-status-current-style "bg=#{@bg_alt},fg=#{@fg}"
set -g window-status-current-format "#[fg=#{@green},bold] #I #W "
set -g window-status-separator ""

set -g status-left "#[fg=#{@bg},bg=#{@green},bold] #S #[fg=#{@green},bg=#{@bg_alt}]#{@separator}#[fg=#{@bg_alt},bg=#{@bg_alt}]"
set -g status-left-length 30 

set -g status-right "\
#{?client_prefix,#[fg=#{@yellow}]prefix #[fg=#{@muted}],}\
#{?window_zoomed_flag,#[fg=#{@yellow}]zoom #[fg=#{@muted}],}\
#{?pane_synchronized,#[fg=#{@yellow}]sync #[fg=#{@muted}],}\
#{?SSH_TTY,#[fg=#{@yellow}]ssh #[fg=#{@muted}],}\
#[fg=#{@bg},bg=#{@green}] #(~/.config/tmux/git-status.sh #{pane_current_path}) \
#[fg=#{@green},bg=#{@bg_alt}]#{@separator}\
#[fg=#{@fg},bg=#{@bg_alt}] #{b:pane_current_path} \
#[fg=#{@bg_alt},bg=#{@bg}]#{@separator}\
#[fg=#{@muted},bg=#{@bg}] L: #(sysctl -n vm.loadavg | awk '{print \$2}') \
#[fg=#{@border}]#{@dot} \
#[fg=#{@magenta},bg=#{@bg}] K8s: #(kubectl config current-context 2>/dev/null || echo 'none') \
#[fg=#{@border}]#{@dot} \
#[fg=#{@muted},bg=#{@bg}] B: #(pmset -g batt | grep -Eo '[0-9]+%') \
#[fg=#{@border}]#{@dot} \
#[fg=#{@muted},bg=#{@bg}] #{session_windows}w "
set -g status-right-length 120

set -g display-panes-time 1000
set -gF display-panes-active-colour "#{@green}"
set -gF display-panes-colour "#{@muted}"

# -----------------------------------------------------------------------------
# Plugins (TPM)
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

run '~/.tmux/plugins/tpm/tpm'
