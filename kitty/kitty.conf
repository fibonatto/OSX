# ==============================================================================
# Kitty Theme
# ==============================================================================

font_family JetBrainsMono Nerd Font Mono
font_size 16.0

# terrazzo (light)

background #F2F1EE
foreground #4A4C52

selection_background #DCD8D2
selection_foreground #4A4C52

# Cursor
cursor #5B8FA8
cursor_text_color background
cursor_shape block
cursor_blink_interval 0
cursor_trail 200
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Window padding
window_padding_width 12

# Links, borders
url_color #5B8FA8
active_border_color #5B8FA8
inactive_border_color #D3D0CA
bell_border_color #B08B4F

# Tab bar
tab_bar_background #EAE8E4
active_tab_foreground #4A4C52
active_tab_background #F2F1EE
inactive_tab_foreground #6B6E73
inactive_tab_background #EAE8E4


# ==============================================================================
# ANSI Colors
# ==============================================================================

# Normal: the same roles as the editor (variable, string, number, func, keyword, property)
color0  #E5E3DF
color1  #C96A61
color2  #6E9B73
color3  #B08B4F
color4  #5B8FA8
color5  #9A6F96
color6  #4A9690
color7  #6B6E73

# Bright: stronger, not lighter (lighter colors lose contrast on a light background)
color8  #8F918F
color9  #AF5C54
color10 #608764
color11 #8C9236
color12 #3F7CA3
color13 #C0658A
color14 #40827D
color15 #4A4C52

# ==============================================================================
# Window
# ==============================================================================

hide_window_decorations titlebar-only
enabled_layouts splits

# ==============================================================================
# macOS
# ==============================================================================

macos_option_as_alt yes
notify_on_cmd_finish invisible 20
macos_quit_when_last_window_closed yes
# startup_session ~/.config/kitty/work.session

# ==============================================================================
# Clipboard
# ==============================================================================

copy_on_select yes

# ==============================================================================
# Keybindings
# ==============================================================================

map cmd+n new_os_window

# Tabs
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5

map cmd+shift+] next_tab
map cmd+shift+[ previous_tab

# Splits
map cmd+h neighboring_window left
map cmd+l neighboring_window right

map cmd+s launch --location=hsplit
map cmd+t launch --location=vsplit --cwd=current

map ctrl+alt+shift+cmd+b launch --type=os-window nvim ~/Basal/index.md

